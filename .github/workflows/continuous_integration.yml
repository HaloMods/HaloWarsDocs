name: CI

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: PhxTools.sln
  ContinuousIntegrationBuild: true
  BUILD_PLATFORM: AnyCPU

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and Test PhxTools (${{ matrix.toolset.name }}, ${{ matrix.build-configuration }})
    runs-on: ${{ matrix.toolset.runner }}
    defaults:
      run:
        working-directory: PhxTools
    strategy:
      matrix:
        dotnet-version: [ '10.0.x' ]
        build-configuration: [ 'Debug', 'Release' ]
        toolset:
          - name: vs2022
            runner: windows-2022
          - name: vs2026
            runner: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
        cache: true
        cache-dependency-path: "PhxTools/**/packages.lock.json"

    - name: Install dependencies
      # Directory.Build.targets enables locked mode for approved lock owners in CI.
      run: >-
        dotnet restore ${{ env.SOLUTION_FILE_PATH }}
        -p:Configuration=${{ matrix.build-configuration }}
        -p:Platform=${{ env.BUILD_PLATFORM }}

    - name: Build PhxTools AnyCPU
      run: >-
        dotnet build ${{ env.SOLUTION_FILE_PATH }}
        -p:Configuration=${{ matrix.build-configuration }}
        -p:Platform=${{ env.BUILD_PLATFORM }}
        --no-restore
        -m

    # MTP-specific arguments follow the additional -- separator.
    - name: Test
      run: >-
        dotnet test ${{ env.SOLUTION_FILE_PATH }}
        -p:Configuration=${{ matrix.build-configuration }}
        -p:Platform=${{ env.BUILD_PLATFORM }}
        --no-build
        --no-restore
        --verbosity normal
        --
        --filter "TestCategory!=ExcludedFromAppveyor"

    - name: Print test logs on failure
      if: failure()
      shell: pwsh
      run: |
        $logs = Get-ChildItem -Path "${{ github.workspace }}" -Recurse -File |
          Where-Object {
            $_.FullName -match '[\\/](TestResults)[\\/]' -and
            $_.Extension -in '.log', '.trx', '.xml'
          }

        if (!$logs) {
          Write-Host "No test result logs found."
          exit 0
        }

        foreach ($log in $logs) {
          Write-Host "::group::$($log.FullName)"
          Get-Content -LiteralPath $log.FullName -Raw
          Write-Host "::endgroup::"
        }
